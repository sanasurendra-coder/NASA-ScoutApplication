<div class="overview-shell">
  <!-- Compact Header Row -->
  <header class="overview-header">
    <div class="header-titles">
      <h1 class="title">NEO Candidate Tracking</h1>
      <p class="subtitle">
        Current Near-Earth Object candidates under evaluation by the JPL Scout system
        @if (store.lastUpdated()) {
          <span> • Updated {{ store.lastUpdated() | date:'shortTime' }}</span>
        }
      </p>
    </div>

    <!-- Actions pulled to the right -->
    <div class="header-actions">
      <div class="search-wrapper">
        <input
          type="text"
          [(ngModel)]="quickFilterText"
          (ngModelChange)="onQuickFilterChange()"
          placeholder="Filter designations or risks..."
          class="compact-search"
        />
      </div>
      <button
        class="refresh-btn"
        (click)="onRefresh()"
        [disabled]="store.isLoading()"
      >
        {{ store.isLoading() ? 'Fetching...' : 'Refresh Feed' }}
      </button>
    </div>
  </header>

  <!-- Error Notification -->
  @if (store.error(); as error) {
    <div class="error-strip">
      <span>{{ error }}</span>
      <button class="retry-link" (click)="onRefresh()">Retry</button>
    </div>
  }

  <!-- Main Grid Area - Fills remaining height with zero parent overflow -->
  <main class="grid-container">
    <ag-grid-angular
      [theme]="theme"
      class="grid-fill"
      [loading]="store.isLoading()"
      [loadingOverlayComponent]="loadingOverlayComponent"
      [rowData]="store.isLoading() ? undefined : store.candidates()"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [pagination]="true"
      [paginationPageSize]="paginationPageSize"
      [paginationPageSizeSelector]="paginationPageSizeSelector"
      [rowHeight]="rowHeight"
      [headerHeight]="headerHeight"
      (gridReady)="onGridReady($event)"
      (rowClicked)="onRowClicked($event)"
    />
  </main>
</div>
